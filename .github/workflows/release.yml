name: Package and publish prerelease

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

env:
  QT_VERSION: 6.10.3

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Resolve and verify release metadata
        id: metadata
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${{ inputs.tag }}"
            git fetch --tags --force
            git rev-parse --verify "refs/tags/${tag}"
            git checkout --detach "refs/tags/${tag}"
          fi
          cmake -DSOURCE_DIR="${GITHUB_WORKSPACE}" -DRELEASE_TAG="${tag}" \
            -P tools/verify_release_version.cmake
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${tag#v}" >> "${GITHUB_OUTPUT}"

  windows:
    name: Windows x64 packages
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      CXX: g++
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Install Qt and MinGW
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_mingw
          tools: tools_mingw1310
          cache: true

      - name: Install pinned NSIS
        shell: pwsh
        run: choco install nsis --version=3.11.0 --no-progress --yes

      - name: Configure, build, and test
        shell: pwsh
        run: |
          cmake -S . -B build/release -G Ninja `
            -D CMAKE_BUILD_TYPE=Release -D BUILD_TESTING=ON `
            -D RETROVDP_RELEASE_BUILD=ON
          cmake --build build/release --parallel 4
          ctest --test-dir build/release --output-on-failure

      - name: Stage and audit standalone runtime
        shell: pwsh
        run: |
          cmake --install build/release --prefix "${PWD}/stage"
          $guiSubsystem = (& objdump -p "${PWD}/stage/bin/RetroVDPStudio.exe" |
            Select-String '\(Windows GUI\)' | Out-String)
          if (-not $guiSubsystem) {
            throw "RetroVDPStudio.exe is not a Windows GUI-subsystem executable."
          }
          $cliSubsystem = (& objdump -p "${PWD}/stage/bin/retrovdp-cli.exe" |
            Select-String '\(Windows CUI\)' | Out-String)
          if (-not $cliSubsystem) {
            throw "retrovdp-cli.exe is not a Windows console-subsystem executable."
          }
          cmake -D ROOT="${PWD}/stage" `
            -D GUI_REL=bin/RetroVDPStudio.exe `
            -D CLI_REL=bin/retrovdp-cli.exe `
            -D PLATFORM=windows -D REQUIRE_QT_LICENSES=ON `
            -P tools/audit_package.cmake
          cmake -D ROOT="${PWD}/stage" `
            -D GUI_REL=bin/RetroVDPStudio.exe `
            -D CLI_REL=bin/retrovdp-cli.exe `
            -D SOURCE_IMAGE="${PWD}/tests/golden/source/tiny-rgba.png" `
            -D OUTPUT_DIR="${PWD}/smoke-output" `
            -D VERSION="${env:RELEASE_VERSION}" `
            -P tools/smoke_test_package.cmake

      - name: Create portable ZIP and installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          cpack --config build/release/CPackConfig.cmake -G ZIP `
            -D "CPACK_PACKAGE_FILE_NAME=RetroVDPStudio-${env:RELEASE_VERSION}-Windows-x64-Portable" `
            -B dist
          cpack --config build/release/CPackConfig.cmake -G NSIS `
            -D "CPACK_PACKAGE_FILE_NAME=RetroVDPStudio-${env:RELEASE_VERSION}-Windows-x64-Setup" `
            -B dist
          if (-not (Test-Path "dist/RetroVDPStudio-${env:RELEASE_VERSION}-Windows-x64-Portable.zip")) { exit 1 }
          if (-not (Test-Path "dist/RetroVDPStudio-${env:RELEASE_VERSION}-Windows-x64-Setup.exe")) { exit 1 }

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: |
            dist/*.exe
            dist/*.zip
          compression-level: 0
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.display_arch }} packages
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            display_arch: x86_64
            uname_arch: x86_64
            qt_host: linux
            qt_arch: linux_gcc_64
            tool_arch: x86_64
            asset_arch: x86_64
            deb_arch: amd64
            artifact_arch: x64
            elf_arch: x86_64
          - runner: ubuntu-24.04-arm
            display_arch: ARM64
            uname_arch: aarch64
            qt_host: linux_arm64
            qt_arch: linux_gcc_arm64
            tool_arch: aarch64
            asset_arch: aarch64
            deb_arch: arm64
            artifact_arch: arm64
            elf_arch: aarch64
    env:
      CXX: g++
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      APPIMAGE_EXTRACT_AND_RUN: "1"
      QML_SOURCES_PATHS: ${{ github.workspace }}/app/qml
      EXPECTED_UNAME_ARCH: ${{ matrix.uname_arch }}
      LINUXDEPLOY_ARCH: ${{ matrix.tool_arch }}
      ASSET_ARCH: ${{ matrix.asset_arch }}
      DEB_ARCH: ${{ matrix.deb_arch }}
      EXPECTED_ELF_ARCH: ${{ matrix.elf_arch }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Install Linux package prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes libfuse2 libgl1 libegl1 libopengl0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 xvfb

      - name: Verify native build architecture
        run: |
          test "$(uname -m)" = "${EXPECTED_UNAME_ARCH}"
          test "$(dpkg --print-architecture)" = "${DEB_ARCH}"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ matrix.qt_host }}
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Configure, build, and test
        run: |
          cmake -S . -B build/release -G Ninja \
            -D CMAKE_BUILD_TYPE=Release -D BUILD_TESTING=ON \
            -D RETROVDP_RELEASE_BUILD=ON
          cmake --build build/release --parallel 4
          xvfb-run -a ctest --test-dir build/release --output-on-failure

      - name: Stage application tree
        run: |
          cmake --install build/release --prefix "${PWD}/AppDir/usr"

      - name: Download pinned AppImage tooling
        run: |
          curl --fail --location --retry 3 \
            --output "linuxdeploy-${LINUXDEPLOY_ARCH}.AppImage" \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-${LINUXDEPLOY_ARCH}.AppImage"
          curl --fail --location --retry 3 \
            --output "linuxdeploy-plugin-qt-${LINUXDEPLOY_ARCH}.AppImage" \
            "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-${LINUXDEPLOY_ARCH}.AppImage"
          chmod +x \
            "linuxdeploy-${LINUXDEPLOY_ARCH}.AppImage" \
            "linuxdeploy-plugin-qt-${LINUXDEPLOY_ARCH}.AppImage"

      - name: Deploy Linux runtime and build AppImage
        run: |
          mkdir -p dist
          "./linuxdeploy-${LINUXDEPLOY_ARCH}.AppImage" \
            --appdir AppDir \
            --executable AppDir/usr/bin/RetroVDPStudio \
            --desktop-file AppDir/usr/share/applications/io.github.ciscogarciafl.RetroVDPStudio.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/io.github.ciscogarciafl.RetroVDPStudio.png \
            --plugin qt \
            --output appimage
          generated_appimage="$(find . -maxdepth 1 -name '*.AppImage' ! -name 'linuxdeploy*' -print -quit)"
          test -n "${generated_appimage}"
          mv "${generated_appimage}" \
            "dist/RetroVDPStudio-${RELEASE_VERSION}-Linux-${ASSET_ARCH}.AppImage"

      - name: Audit and smoke-test deployed Linux tree
        run: |
          bash tools/audit-elf-architecture.sh \
            "${PWD}/AppDir/usr" "${EXPECTED_ELF_ARCH}"
          cmake -D ROOT="${PWD}/AppDir/usr" \
            -D GUI_REL=bin/RetroVDPStudio \
            -D CLI_REL=bin/retrovdp-cli \
            -D PLATFORM=linux -D REQUIRE_QT_LICENSES=ON \
            -P tools/audit_package.cmake
          xvfb-run -a cmake -D ROOT="${PWD}/AppDir/usr" \
            -D GUI_REL=bin/RetroVDPStudio \
            -D CLI_REL=bin/retrovdp-cli \
            -D SOURCE_IMAGE="${PWD}/tests/golden/source/tiny-rgba.png" \
            -D OUTPUT_DIR="${PWD}/smoke-output" \
            -D VERSION="${RELEASE_VERSION}" \
            -P tools/smoke_test_package.cmake
          xvfb-run -a \
            "dist/RetroVDPStudio-${RELEASE_VERSION}-Linux-${ASSET_ARCH}.AppImage" \
            --smoke-test
          ldd AppDir/usr/bin/RetroVDPStudio | tee gui-dependencies.txt
          ! grep -q "not found" gui-dependencies.txt

      - name: Build and install-test Debian package
        run: |
          deb="dist/retrovdp-studio_${RELEASE_VERSION}_${DEB_ARCH}.deb"
          bash packaging/linux/build-isolated-deb.sh \
            "${PWD}/AppDir/usr" "${PWD}/DebRoot" \
            "${RELEASE_VERSION}" "${DEB_ARCH}" "${PWD}/${deb}"

          bash tools/audit-elf-architecture.sh \
            "${PWD}/DebRoot/opt/retrovdp-studio" "${EXPECTED_ELF_ARCH}"
          cmake -D ROOT="${PWD}/DebRoot/opt/retrovdp-studio" \
            -D GUI_REL=bin/RetroVDPStudio \
            -D CLI_REL=bin/retrovdp-cli \
            -D PLATFORM=linux -D REQUIRE_QT_LICENSES=ON \
            -P tools/audit_package.cmake
          cmake -D ROOT="${PWD}/DebRoot" \
            -D EXPECTED_DEB_ARCH="${DEB_ARCH}" \
            -P tools/audit_debian_layout.cmake
          xvfb-run -a cmake \
            -D ROOT="${PWD}/DebRoot/opt/retrovdp-studio" \
            -D GUI_REL=bin/RetroVDPStudio \
            -D CLI_REL=bin/retrovdp-cli \
            -D SOURCE_IMAGE="${PWD}/tests/golden/source/tiny-rgba.png" \
            -D OUTPUT_DIR="${PWD}/deb-smoke-output" \
            -D VERSION="${RELEASE_VERSION}" \
            -P tools/smoke_test_package.cmake

          test "$(stat -c '%a' "${deb}")" = 644
          installed_size="$(dpkg-deb -f "${deb}" Installed-Size)"
          [[ "${installed_size}" =~ ^[1-9][0-9]*$ ]]
          test "$(dpkg-deb -f "${deb}" Architecture)" = "${DEB_ARCH}"
          dpkg-deb --contents "${deb}" > deb-contents.txt
          ! grep -Eq \
            '[.]/usr/bin/qt[.]conf$|[.]/usr/(plugins|qml)(/|$)|[.]/apprun-hooks(/|$)|[.]/usr/lib/lib(Qt|xcb|X11)' \
            deb-contents.txt

          for forbidden in \
            /usr/bin/qt.conf /usr/plugins /usr/qml /apprun-hooks; do
            test ! -e "${forbidden}"
          done
          sudo apt-get install --yes "./${deb}"
          test -f /opt/retrovdp-studio/bin/qt.conf
          test -f /opt/retrovdp-studio/plugins/platforms/libqxcb.so
          for forbidden in \
            /usr/bin/qt.conf /usr/plugins /usr/qml /apprun-hooks; do
            test ! -e "${forbidden}"
          done
          dpkg-query -L retrovdp-studio > installed-files.txt
          ! grep -Eq \
            '^/usr/bin/qt[.]conf$|^/usr/(plugins|qml)(/|$)|^/apprun-hooks(/|$)|^/usr/lib/lib(Qt|xcb|X11)' \
            installed-files.txt
          xvfb-run -a /usr/bin/RetroVDPStudio --smoke-test
          /usr/bin/retrovdp-cli --version | grep "${RELEASE_VERSION}"

          sudo apt-get remove --yes retrovdp-studio
          test ! -e /opt/retrovdp-studio
          test ! -e /usr/bin/RetroVDPStudio
          test ! -e /usr/bin/retrovdp-cli
          for forbidden in \
            /usr/bin/qt.conf /usr/plugins /usr/qml /apprun-hooks; do
            test ! -e "${forbidden}"
          done

      - name: Upload Linux release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.artifact_arch }}
          path: |
            dist/*.AppImage
            dist/*.deb
          compression-level: 0
          if-no-files-found: error

  linux_arm64_current:
    name: Linux ARM64 packages on Ubuntu 24.04
    needs: [validate, linux]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Download ARM64 release assets
        uses: actions/download-artifact@v5
        with:
          name: release-linux-arm64
          path: dist

      - name: Install runtime prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgl1 libegl1 libopengl0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 xvfb

      - name: Audit and smoke-test AppImage
        run: |
          appimage="dist/RetroVDPStudio-${RELEASE_VERSION}-Linux-aarch64.AppImage"
          test "$(uname -m)" = aarch64
          test "$(dpkg --print-architecture)" = arm64
          test -s "${appimage}"
          chmod +x "${appimage}"
          "${appimage}" --appimage-extract >/dev/null
          bash tools/audit-elf-architecture.sh \
            "${PWD}/squashfs-root/usr" aarch64
          xvfb-run -a "${appimage}" --smoke-test

      - name: Audit, install-test, and remove Debian package
        run: |
          deb="dist/retrovdp-studio_${RELEASE_VERSION}_arm64.deb"
          test -s "${deb}"
          test "$(dpkg-deb -f "${deb}" Architecture)" = arm64
          mkdir -p deb-current
          dpkg-deb --extract "${deb}" deb-current
          bash tools/audit-elf-architecture.sh \
            "${PWD}/deb-current/opt/retrovdp-studio" aarch64
          sudo apt-get install --yes "./${deb}"
          xvfb-run -a /usr/bin/RetroVDPStudio --smoke-test
          /usr/bin/retrovdp-cli --version | grep "${RELEASE_VERSION}"
          sudo apt-get remove --yes retrovdp-studio
          test ! -e /opt/retrovdp-studio
          test ! -e /usr/bin/RetroVDPStudio
          test ! -e /usr/bin/retrovdp-cli

  macos:
    name: macOS ${{ matrix.arch }} package
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
    env:
      CXX: clang++
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - name: Configure, build, and test
        run: |
          cmake -S . -B build/release -G Ninja \
            -D CMAKE_BUILD_TYPE=Release \
            -D CMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -D CMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -D BUILD_TESTING=ON \
            -D RETROVDP_RELEASE_BUILD=ON
          cmake --build build/release --parallel 4
          ctest --test-dir build/release --output-on-failure

      - name: Stage, ad-hoc sign, audit, and smoke test
        run: |
          cmake --install build/release --prefix "${PWD}/stage"
          codesign --force --deep --sign - stage/RetroVDPStudio.app
          cmake -D ROOT="${PWD}/stage" \
            -D GUI_REL=RetroVDPStudio.app/Contents/MacOS/RetroVDPStudio \
            -D CLI_REL=bin/retrovdp-cli \
            -D PLATFORM=macos -D REQUIRE_QT_LICENSES=ON \
            -P tools/audit_package.cmake
          cmake -D ROOT="${PWD}/stage" \
            -D GUI_REL=RetroVDPStudio.app/Contents/MacOS/RetroVDPStudio \
            -D CLI_REL=bin/retrovdp-cli \
            -D SOURCE_IMAGE="${PWD}/tests/golden/source/tiny-rgba.png" \
            -D OUTPUT_DIR="${PWD}/smoke-output" \
            -D VERSION="${RELEASE_VERSION}" \
            -P tools/smoke_test_package.cmake
          codesign --verify --deep --strict stage/RetroVDPStudio.app
          otool -L stage/RetroVDPStudio.app/Contents/MacOS/RetroVDPStudio | tee gui-dependencies.txt
          ! grep -q "${PWD}" gui-dependencies.txt

      - name: Create DMG
        run: |
          mkdir -p dist
          dmg="dist/RetroVDPStudio-${RELEASE_VERSION}-macOS-${{ matrix.arch }}.dmg"
          dmg_root="${RUNNER_TEMP}/retrovdp-studio-dmg-${{ matrix.arch }}"
          rm -rf -- "${dmg_root}"
          mkdir -p "${dmg_root}"
          cp -a stage/. "${dmg_root}/"
          ln -s /Applications "${dmg_root}/Applications"
          for attempt in 1 2 3; do
            rm -f -- "${dmg}"
            hdiutil create -ov -srcfolder "${dmg_root}" \
              -volname "RetroVDP Studio" -format UDZO "${dmg}" &
            dmg_pid=$!
            (
              sleep 600
              if kill -0 "${dmg_pid}" 2>/dev/null; then
                echo "DMG creation timed out; stopping hdiutil."
                kill -TERM "${dmg_pid}" 2>/dev/null || true
              fi
            ) &
            watchdog_pid=$!
            if wait "${dmg_pid}"; then
              dmg_status=0
            else
              dmg_status=$?
            fi
            kill "${watchdog_pid}" 2>/dev/null || true
            wait "${watchdog_pid}" 2>/dev/null || true
            if [[ "${dmg_status}" -eq 0 ]]; then
              break
            fi
            if [[ "${attempt}" -eq 3 ]]; then
              exit 1
            fi
            echo "hdiutil failed or was temporarily busy; retrying DMG creation (${attempt}/3)."
            sleep $((attempt * 15))
          done
          test -f "${dmg}"
          hdiutil verify "${dmg}"

      - name: Upload macOS release asset
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: dist/*.dmg
          compression-level: 0
          if-no-files-found: error

  publish:
    name: Publish GitHub prerelease
    needs: [validate, windows, linux, linux_arm64_current, macos]
    runs-on: ubuntu-22.04
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Download all release assets
        uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Verify asset set and generate checksums
        shell: bash
        run: |
          expected=(
            "RetroVDPStudio-${RELEASE_VERSION}-Windows-x64-Setup.exe"
            "RetroVDPStudio-${RELEASE_VERSION}-Windows-x64-Portable.zip"
            "RetroVDPStudio-${RELEASE_VERSION}-Linux-x86_64.AppImage"
            "retrovdp-studio_${RELEASE_VERSION}_amd64.deb"
            "RetroVDPStudio-${RELEASE_VERSION}-Linux-aarch64.AppImage"
            "retrovdp-studio_${RELEASE_VERSION}_arm64.deb"
            "RetroVDPStudio-${RELEASE_VERSION}-macOS-x86_64.dmg"
            "RetroVDPStudio-${RELEASE_VERSION}-macOS-arm64.dmg"
          )
          for asset in "${expected[@]}"; do
            test -s "release-assets/${asset}"
          done
          find release-assets -maxdepth 1 -type f ! -name SHA256SUMS.txt \
            -printf '%f\n' | sort > actual-assets.txt
          printf '%s\n' "${expected[@]}" | sort > expected-assets.txt
          diff -u expected-assets.txt actual-assets.txt
          (cd release-assets && sha256sum "${expected[@]}" > SHA256SUMS.txt)
          (cd release-assets && sha256sum --check SHA256SUMS.txt)

      - name: Create immutable GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; refusing to replace published assets." >&2
            exit 1
          fi
          gh release create "${TAG}" release-assets/* \
            --verify-tag \
            --prerelease \
            --title "RetroVDP Studio ${TAG}" \
            --notes-file "docs/releases/${TAG}.md"

      - name: Preserve final asset set
        uses: actions/upload-artifact@v4
        with:
          name: published-${{ needs.validate.outputs.tag }}
          path: release-assets/*
          compression-level: 0
          if-no-files-found: error
