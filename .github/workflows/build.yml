name: Build and test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (MinGW x64)
            os: windows-latest
            compiler: g++
            qt_host: ""
            qt_arch: ""
          - name: Ubuntu (GCC x64)
            os: ubuntu-24.04
            compiler: g++
            qt_host: ""
            qt_arch: ""
          - name: Ubuntu (GCC ARM64)
            os: ubuntu-24.04-arm
            compiler: g++
            qt_host: linux_arm64
            qt_arch: linux_gcc_arm64
          - name: macOS (AppleClang Intel)
            os: macos-15-intel
            compiler: clang++
            qt_host: ""
            qt_arch: ""
          - name: macOS (AppleClang ARM64)
            os: macos-15
            compiler: clang++
            qt_host: ""
            qt_arch: ""

    env:
      CXX: ${{ matrix.compiler }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Qt (Windows MinGW)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.10.3
          arch: win64_mingw
          tools: tools_mingw1310
          cache: true

      - name: Install Qt
        if: runner.os != 'Windows' && matrix.qt_host == ''
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.10.3
          cache: true

      - name: Install Qt (Linux ARM64)
        if: matrix.qt_host == 'linux_arm64'
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.10.3
          host: ${{ matrix.qt_host }}
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Configure
        run: cmake --preset ci-release

      - name: Build
        run: cmake --build --preset ci-release

      - name: Test
        run: ctest --preset ci-release
